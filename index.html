<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>This Week's Menu</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; -webkit-tap-highlight-color: transparent; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ---------- THEME ----------
const C = {
  paper: '#EEEDE7',
  paperCard: '#FFFFFF',
  ink: '#22271F',
  inkSoft: '#5B6156',
  sage: '#3F6B4A',
  sageSoft: '#DCE6DE',
  mustard: '#C98A2C',
  mustardSoft: '#F3E4C8',
  line: '#D8D6CC',
  danger: '#B5493A',
};

const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const STORAGE_KEY = 'mealPlannerApiUrl';

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function prettyDate(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

// ---------- TINY ICONS (text-based, no icon library needed) ----------
const Icon = ({ children, size = 18, color = 'currentColor' }) => (
  <span style={{ fontSize: size, color, lineHeight: 1, display: 'inline-block' }}>{children}</span>
);
const IconPlus = (p) => <Icon {...p}>+</Icon>;
const IconX = (p) => <Icon {...p}>✕</Icon>;
const IconSettings = (p) => <Icon {...p}>⚙</Icon>;
const IconChevronLeft = (p) => <Icon {...p}>‹</Icon>;
const IconChevronRight = (p) => <Icon {...p}>›</Icon>;
const IconHistory = (p) => <Icon {...p}>↺</Icon>;
const IconSkip = (p) => <Icon {...p}>⏭</Icon>;
const IconTrash = (p) => <Icon {...p}>🗑</Icon>;
const IconLoader = ({ size = 28, color = C.sage }) => (
  <div className="spin" style={{ width: size, height: size, border: `3px solid ${C.sageSoft}`, borderTopColor: color, borderRadius: '50%' }} />
);

function MealPlanner() {
  const [apiUrl, setApiUrl] = useState('');
  const [apiUrlInput, setApiUrlInput] = useState('');
  const [ready, setReady] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');

  const [meals, setMeals] = useState([]);
  const [categories, setCategories] = useState([]);
  const [weekPlan, setWeekPlan] = useState({});
  const [lastWeekPlan, setLastWeekPlan] = useState({});
  const [weeksList, setWeeksList] = useState([]);

  const [showSettings, setShowSettings] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [historyWeek, setHistoryWeek] = useState(null);
  const [historyRows, setHistoryRows] = useState({});

  const [activeSlot, setActiveSlot] = useState(null);
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [newCategoryText, setNewCategoryText] = useState('');
  const [showNewCategory, setShowNewCategory] = useState(false);
  const [newMealText, setNewMealText] = useState('');
  const [busy, setBusy] = useState(false);

  const monday = getMonday(new Date());
  const weekStart = isoDate(monday);
  const lastMonday = addDays(monday, -7);
  const lastWeekStart = isoDate(lastMonday);
  const days = DAY_NAMES.map((name, i) => ({ name, date: addDays(monday, i), key: isoDate(addDays(monday, i)) }));

  const apiGet = useCallback(async (action, params = {}) => {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`${apiUrl}?${qs}`);
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    return res.json();
  }, [apiUrl]);

  const apiPost = useCallback(async (action, payload = {}) => {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
    });
    if (!res.ok) throw new Error(`Request failed (${res.status})`);
    return res.json();
  }, [apiUrl]);

  useEffect(() => {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) { setApiUrl(stored); setReady(true); } else { setLoading(false); }
  }, []);

  const loadAll = useCallback(async () => {
    setLoading(true);
    setError('');
    try {
      const [mealsRes, catsRes, weekRes, lastWeekRes] = await Promise.all([
        apiGet('getMeals'), apiGet('getCategories'),
        apiGet('getWeek', { weekStart }), apiGet('getWeek', { weekStart: lastWeekStart }),
      ]);
      if (mealsRes.error) throw new Error(mealsRes.error);
      setMeals(mealsRes);
      setCategories(catsRes);
      const wp = {};
      (weekRes || []).forEach(r => { if (r.status === 'assigned' || r.status === 'skipped') wp[`${r.day}-${r.slot}`] = r; });
      setWeekPlan(wp);
      const lwp = {};
      (lastWeekRes || []).forEach(r => { if (r.status === 'assigned') lwp[`${r.day}-${r.slot}`] = r; });
      setLastWeekPlan(lwp);
    } catch (e) {
      setError(e.message || 'Could not reach the sheet. Check the API URL in Settings.');
    } finally {
      setLoading(false);
    }
  }, [apiGet, weekStart, lastWeekStart]);

  useEffect(() => { if (ready && apiUrl) loadAll(); }, [ready, apiUrl, loadAll]);

  function saveApiUrl() {
    const trimmed = apiUrlInput.trim();
    if (!trimmed) return;
    localStorage.setItem(STORAGE_KEY, trimmed);
    setApiUrl(trimmed);
    setReady(true);
    setShowSettings(false);
  }

  function openSlot(dayName, slot) {
    setActiveSlot({ day: dayName, slot });
    setSelectedCategory(null);
    setShowNewCategory(false);
    setNewCategoryText('');
    setNewMealText('');
  }
  function closeSlot() { setActiveSlot(null); setSelectedCategory(null); }

  async function assignMeal(mealId, mealName) {
    if (!activeSlot) return;
    setBusy(true);
    try {
      await apiPost('setSlot', { weekStart, day: activeSlot.day, slot: activeSlot.slot, mealId, mealName, status: 'assigned' });
      setWeekPlan(prev => ({ ...prev, [`${activeSlot.day}-${activeSlot.slot}`]: { day: activeSlot.day, slot: activeSlot.slot, mealId, mealName, status: 'assigned' } }));
      closeSlot();
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  }

  async function skipSlot() {
    if (!activeSlot) return;
    setBusy(true);
    try {
      await apiPost('setSlot', { weekStart, day: activeSlot.day, slot: activeSlot.slot, mealId: '', mealName: '', status: 'skipped' });
      setWeekPlan(prev => ({ ...prev, [`${activeSlot.day}-${activeSlot.slot}`]: { day: activeSlot.day, slot: activeSlot.slot, mealId: '', mealName: '', status: 'skipped' } }));
      closeSlot();
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  }

  async function clearSlot(dayName, slot) {
    setBusy(true);
    try {
      await apiPost('setSlot', { weekStart, day: dayName, slot, mealId: '', mealName: '', status: '' });
      setWeekPlan(prev => { const next = { ...prev }; delete next[`${dayName}-${slot}`]; return next; });
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  }

  async function addCategory() {
    const name = newCategoryText.trim();
    if (!name) return;
    setBusy(true);
    try {
      await apiPost('addCategory', { name });
      setCategories(prev => (prev.includes(name) ? prev : [...prev, name]));
      setSelectedCategory(name);
      setShowNewCategory(false);
      setNewCategoryText('');
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  }

  async function addAndAssignMeal(category, slotType) {
    const name = newMealText.trim();
    if (!name) return;
    setBusy(true);
    try {
      const res = await apiPost('addMeal', { name, category: category || '', slot: slotType });
      setMeals(prev => [...prev, res]);
      setNewMealText('');
      await assignMeal(res.id, res.name);
    } catch (e) { setError(e.message); setBusy(false); }
  }

  async function loadWeeksList() {
    setShowHistory(true);
    try {
      const list = await apiGet('getWeeksList');
      setWeeksList(list.filter(w => w !== weekStart));
    } catch (e) { setError(e.message); }
  }
  async function viewWeek(ws) {
    setHistoryWeek(ws);
    try {
      const rows = await apiGet('getWeek', { weekStart: ws });
      const obj = {};
      rows.forEach(r => { obj[`${r.day}-${r.slot}`] = r; });
      setHistoryRows(obj);
    } catch (e) { setError(e.message); }
  }

  if (!ready) {
    return (
      <div style={{ background: C.paper, minHeight: '100vh' }} className="flex items-center justify-center p-6">
        <div style={{ background: C.paperCard, borderColor: C.line }} className="w-full max-w-sm rounded-2xl border p-6 shadow-sm">
          <h1 style={{ color: C.ink, fontFamily: 'Georgia, serif' }} className="text-2xl mb-1">This Week's Menu</h1>
          <p style={{ color: C.inkSoft }} className="text-sm mb-5">Paste the Web app URL from your Apps Script deployment to connect your sheet.</p>
          <input value={apiUrlInput} onChange={e => setApiUrlInput(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"
            style={{ borderColor: C.line, color: C.ink }} className="w-full rounded-lg border px-3 py-2 text-sm mb-3 outline-none" />
          <button onClick={saveApiUrl} style={{ background: C.sage }} className="w-full text-white rounded-lg py-2.5 text-sm font-medium active:opacity-80">Connect</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: C.paper, minHeight: '100vh' }} className="pb-10">
      <div style={{ background: C.sage }} className="px-5 pt-6 pb-5 rounded-b-3xl shadow-sm">
        <div className="flex items-center justify-between">
          <div>
            <p style={{ color: C.mustardSoft }} className="text-xs uppercase tracking-widest mb-0.5">Week of</p>
            <h1 style={{ fontFamily: 'Georgia, serif' }} className="text-white text-2xl">{prettyDate(monday)} – {prettyDate(addDays(monday, 6))}</h1>
          </div>
          <div className="flex gap-1">
            <button onClick={loadWeeksList} className="p-2 rounded-full active:bg-white/10"><IconHistory color="white" /></button>
            <button onClick={() => { setApiUrlInput(apiUrl); setShowSettings(true); }} className="p-2 rounded-full active:bg-white/10"><IconSettings color="white" /></button>
          </div>
        </div>
      </div>

      {loading && <div className="flex items-center justify-center py-16"><IconLoader /></div>}

      {error && !loading && (
        <div style={{ background: '#FBEAE7', color: C.danger, borderColor: C.danger }} className="mx-4 mt-4 border rounded-lg p-3 text-sm">{error}</div>
      )}

      {!loading && (
        <div className="px-4 pt-4 space-y-3">
          {days.map(day => (
            <DayCard key={day.key} day={day} weekPlan={weekPlan} onOpenSlot={openSlot} onClearSlot={clearSlot} />
          ))}
        </div>
      )}

      {activeSlot && (
        <SlotSheet
          activeSlot={activeSlot} categories={categories} meals={meals} weekPlan={weekPlan} lastWeekPlan={lastWeekPlan}
          selectedCategory={selectedCategory} setSelectedCategory={setSelectedCategory}
          showNewCategory={showNewCategory} setShowNewCategory={setShowNewCategory}
          newCategoryText={newCategoryText} setNewCategoryText={setNewCategoryText}
          newMealText={newMealText} setNewMealText={setNewMealText} busy={busy}
          onClose={closeSlot} onAssign={assignMeal} onSkip={skipSlot} onAddCategory={addCategory} onAddAndAssignMeal={addAndAssignMeal}
        />
      )}

      {showSettings && (
        <Sheet onClose={() => setShowSettings(false)} title="Settings">
          <p style={{ color: C.inkSoft }} className="text-sm mb-3">Apps Script Web app URL</p>
          <input value={apiUrlInput} onChange={e => setApiUrlInput(e.target.value)} style={{ borderColor: C.line, color: C.ink }}
            className="w-full rounded-lg border px-3 py-2 text-sm mb-3 outline-none" />
          <button onClick={saveApiUrl} style={{ background: C.sage }} className="w-full text-white rounded-lg py-2.5 text-sm font-medium mb-2">Save & Reload</button>
        </Sheet>
      )}

      {showHistory && (
        <Sheet onClose={() => { setShowHistory(false); setHistoryWeek(null); }} title="Past Weeks">
          {!historyWeek && (
            <div className="space-y-1">
              {weeksList.length === 0 && <p style={{ color: C.inkSoft }} className="text-sm">No saved weeks yet.</p>}
              {weeksList.map(ws => (
                <button key={ws} onClick={() => viewWeek(ws)} style={{ borderColor: C.line, color: C.ink }}
                  className="w-full text-left border rounded-lg px-3 py-2.5 text-sm flex items-center justify-between">
                  Week of {ws}<IconChevronRight color={C.inkSoft} />
                </button>
              ))}
            </div>
          )}
          {historyWeek && (
            <div>
              <button onClick={() => setHistoryWeek(null)} className="flex items-center gap-1 text-sm mb-3" style={{ color: C.sage }}>
                <IconChevronLeft /> Back to weeks
              </button>
              <div className="space-y-2">
                {DAY_NAMES.map(dn => (
                  <div key={dn} style={{ borderColor: C.line }} className="border rounded-lg p-2.5">
                    <p style={{ color: C.ink }} className="text-sm font-medium mb-1">{dn}</p>
                    {['Lunch', 'Dinner'].map(slot => {
                      const row = historyRows[`${dn}-${slot}`];
                      return <p key={slot} style={{ color: C.inkSoft }} className="text-xs">{slot}: {row ? (row.status === 'skipped' ? 'Skipped' : row.mealName) : '—'}</p>;
                    })}
                  </div>
                ))}
              </div>
            </div>
          )}
        </Sheet>
      )}
    </div>
  );
}

function DayCard({ day, weekPlan, onOpenSlot, onClearSlot }) {
  return (
    <div style={{ background: C.paperCard, borderColor: C.line }} className="rounded-2xl border overflow-hidden">
      <div style={{ borderColor: C.line }} className="flex items-baseline justify-between px-4 pt-3 pb-2 border-b">
        <h2 style={{ color: C.ink, fontFamily: 'Georgia, serif' }} className="text-lg">{day.name}</h2>
        <span style={{ color: C.inkSoft, fontFamily: 'monospace' }} className="text-xs">{prettyDate(day.date)}</span>
      </div>
      <SlotRow label="Lunch" accent={C.mustard} entry={weekPlan[`${day.name}-Lunch`]} onOpen={() => onOpenSlot(day.name, 'Lunch')} onClear={() => onClearSlot(day.name, 'Lunch')} />
      <div style={{ borderColor: C.line }} className="border-t border-dashed mx-4" />
      <SlotRow label="Dinner" accent={C.sage} entry={weekPlan[`${day.name}-Dinner`]} onOpen={() => onOpenSlot(day.name, 'Dinner')} onClear={() => onClearSlot(day.name, 'Dinner')} />
    </div>
  );
}

function SlotRow({ label, accent, entry, onOpen, onClear }) {
  const isSkipped = entry && entry.status === 'skipped';
  const isFilled = entry && entry.status === 'assigned';
  return (
    <div className="flex items-center px-4 py-2.5">
      <span style={{ background: accent }} className="w-1.5 h-1.5 rounded-full mr-2.5 shrink-0" />
      <button onClick={onOpen} className="flex-1 text-left flex items-center justify-between min-w-0">
        <span style={{ color: C.inkSoft }} className="text-xs uppercase tracking-wide w-14 shrink-0">{label}</span>
        <span style={{ color: isFilled ? C.ink : C.inkSoft }} className={`flex-1 text-sm truncate px-2 ${isSkipped ? 'italic' : ''}`}>
          {isFilled ? entry.mealName : isSkipped ? 'Skipped' : 'Tap to add'}
        </span>
        <IconChevronRight color={C.inkSoft} />
      </button>
      {(isFilled || isSkipped) && <button onClick={onClear} className="ml-1 p-1 shrink-0"><IconTrash size={14} color={C.inkSoft} /></button>}
    </div>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end" style={{ background: 'rgba(34,39,31,0.4)' }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.paper, maxHeight: '85vh' }} className="w-full rounded-t-3xl p-5 overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h3 style={{ color: C.ink, fontFamily: 'Georgia, serif' }} className="text-xl">{title}</h3>
          <button onClick={onClose} className="p-1"><IconX color={C.inkSoft} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function SlotSheet({ activeSlot, categories, meals, weekPlan, lastWeekPlan, selectedCategory, setSelectedCategory,
  showNewCategory, setShowNewCategory, newCategoryText, setNewCategoryText, newMealText, setNewMealText, busy,
  onClose, onAssign, onSkip, onAddCategory, onAddAndAssignMeal }) {
  const isDinner = activeSlot.slot === 'Dinner';

  function usedTag(meal) {
    const usedThisWeekEntry = Object.values(weekPlan).find(r => r.mealId === meal.id && r.status === 'assigned');
    if (usedThisWeekEntry) return `Used ${usedThisWeekEntry.day}`;
    const usedLastWeekEntry = Object.values(lastWeekPlan).find(r => r.mealId === meal.id);
    if (usedLastWeekEntry) return 'Last week';
    return null;
  }

  const lunchMeals = meals.filter(m => m.slot === 'Lunch');
  const categoryMeals = selectedCategory ? meals.filter(m => m.category === selectedCategory && m.slot === 'Dinner') : [];

  return (
    <div className="fixed inset-0 z-50 flex items-end" style={{ background: 'rgba(34,39,31,0.4)' }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.paper, maxHeight: '88vh' }} className="w-full rounded-t-3xl p-5 overflow-y-auto">
        <div className="flex items-center justify-between mb-1">
          <h3 style={{ color: C.ink, fontFamily: 'Georgia, serif' }} className="text-xl">{activeSlot.day} · {activeSlot.slot}</h3>
          <button onClick={onClose} className="p-1"><IconX color={C.inkSoft} /></button>
        </div>

        <button onClick={onSkip} disabled={busy} style={{ borderColor: C.line, color: C.inkSoft }}
          className="flex items-center gap-1.5 text-sm border rounded-full px-3 py-1.5 mb-4 mt-2">
          <IconSkip size={14} /> Skip this slot
        </button>

        {isDinner ? (
          <>
            <p style={{ color: C.inkSoft }} className="text-xs uppercase tracking-wide mb-2">Category</p>
            <div className="flex flex-wrap gap-2 mb-4">
              {categories.map(cat => (
                <button key={cat} onClick={() => setSelectedCategory(cat)}
                  style={{ background: selectedCategory === cat ? C.sage : C.paperCard, color: selectedCategory === cat ? 'white' : C.ink, borderColor: C.line }}
                  className="border rounded-full px-3.5 py-1.5 text-sm">{cat}</button>
              ))}
              {!showNewCategory && (
                <button onClick={() => setShowNewCategory(true)} style={{ borderColor: C.line, color: C.sage }}
                  className="border rounded-full px-3 py-1.5 text-sm flex items-center gap-1"><IconPlus size={14} /> New</button>
              )}
            </div>

            {showNewCategory && (
              <div className="flex gap-2 mb-4">
                <input autoFocus value={newCategoryText} onChange={e => setNewCategoryText(e.target.value)} placeholder="e.g. Stir-fry"
                  style={{ borderColor: C.line, color: C.ink }} className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" />
                <button onClick={onAddCategory} disabled={busy} style={{ background: C.sage }} className="text-white rounded-lg px-4 text-sm">Add</button>
              </div>
            )}

            {selectedCategory && (
              <div>
                <p style={{ color: C.inkSoft }} className="text-xs uppercase tracking-wide mb-2">{selectedCategory} meals</p>
                <div className="space-y-1.5 mb-3">
                  {categoryMeals.length === 0 && <p style={{ color: C.inkSoft }} className="text-sm italic">No meals in this category yet — add one below.</p>}
                  {categoryMeals.map(meal => {
                    const tag = usedTag(meal);
                    return (
                      <button key={meal.id} onClick={() => onAssign(meal.id, meal.name)} disabled={busy}
                        style={{ background: C.paperCard, borderColor: C.line }}
                        className="w-full flex items-center justify-between border rounded-lg px-3 py-2.5 text-left">
                        <span style={{ color: C.ink }} className="text-sm">{meal.name}</span>
                        {tag && <span style={{ background: C.mustardSoft, color: '#8A5D1B' }} className="text-xs rounded-full px-2 py-0.5 shrink-0 ml-2">{tag}</span>}
                      </button>
                    );
                  })}
                </div>
                <div className="flex gap-2">
                  <input value={newMealText} onChange={e => setNewMealText(e.target.value)} placeholder="Add new meal..."
                    style={{ borderColor: C.line, color: C.ink }} className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" />
                  <button onClick={() => onAddAndAssignMeal(selectedCategory, 'Dinner')} disabled={busy} style={{ background: C.sage }}
                    className="text-white rounded-lg px-4 text-sm flex items-center gap-1"><IconPlus size={14} /> Add</button>
                </div>
              </div>
            )}
          </>
        ) : (
          <>
            <p style={{ color: C.inkSoft }} className="text-xs uppercase tracking-wide mb-2">Lunches</p>
            <div className="space-y-1.5 mb-3">
              {lunchMeals.length === 0 && <p style={{ color: C.inkSoft }} className="text-sm italic">No lunches saved yet — add one below.</p>}
              {lunchMeals.map(meal => (
                <button key={meal.id} onClick={() => onAssign(meal.id, meal.name)} disabled={busy}
                  style={{ background: C.paperCard, borderColor: C.line }} className="w-full flex items-center justify-between border rounded-lg px-3 py-2.5 text-left">
                  <span style={{ color: C.ink }} className="text-sm">{meal.name}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <input value={newMealText} onChange={e => setNewMealText(e.target.value)} placeholder="Add new lunch..."
                style={{ borderColor: C.line, color: C.ink }} className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" />
              <button onClick={() => onAddAndAssignMeal('', 'Lunch')} disabled={busy} style={{ background: C.mustard }}
                className="text-white rounded-lg px-4 text-sm flex items-center gap-1"><IconPlus size={14} /> Add</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MealPlanner />);
</script>
</body>
</html>
